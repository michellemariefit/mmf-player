<!doctype html>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play · 21 Day Fit Pregnancy Challenge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dd2289">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="21 Day">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* Guided play mode: one exercise at a time, one big button. Walks through every round of every
   circuit, runs the rest timers, and for cardio runs the work timers too. Saves ticks to the same
   place as the list view (index.html). Link: play.html#w1-arms */
html,body{height:100%}
body{font-size:17px;line-height:1.4;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0)) max(14px,env(safe-area-inset-bottom,0)) max(14px,env(safe-area-inset-left,0))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px}
.top .where{font:700 15px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.top .where small{display:block;color:var(--muted);letter-spacing:.02em;font-size:13px;font-family:var(--body);text-transform:none;font-weight:400}
.top a,.top button.x{font:700 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.dots{display:flex;gap:4px;margin-bottom:12px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--brand)}.dots i.now{background:var(--accent)}
main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
main .row{margin-top:auto}
.card{border-radius:22px;padding:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;position:relative}
.pair img{width:100%;aspect-ratio:16/13;object-fit:cover;border-radius:14px;background:var(--brand-soft);display:block}
.pair figcaption{position:absolute;left:8px;top:8px;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:rgba(54,45,112,.82);color:#fff;padding:5px 7px;border-radius:6px}
@media (min-height:760px){.pair{grid-template-columns:1fr}.pair img{aspect-ratio:16/10}}
h1{display:flex;gap:10px;align-items:baseline;font-size:clamp(26px,7.5vw,34px)}
.code{font:700 15px/1 var(--display);color:var(--accent-ink);background:var(--accent);border-radius:7px;padding:5px 7px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cue{margin:0;color:var(--muted);font-size:15px}
.links{display:flex;gap:14px;flex-wrap:wrap}
.links button,.links a{background:none;border:0;padding:6px 0;font-weight:700;color:var(--accent);text-decoration:none}
.embed{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.embed iframe{width:100%;height:100%;border:0}
.row{display:flex;gap:8px}
.row .back{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0 16px;font:700 16px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.row .go{flex:1}
.hold{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.hold .t{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2.2ch}
.hold button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:12px;padding:10px 14px;font-weight:700;margin-left:auto}
.restcard{flex:1;background:var(--brand);color:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;position:relative;overflow:hidden}
.restcard .big{font:700 clamp(90px,30vw,150px)/1 var(--display);font-variant-numeric:tabular-nums}
.restcard .lbl{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.restcard .sub{opacity:.85;font-size:16px}
.restcard .next{margin-top:8px;background:rgba(255,255,255,.15);border-radius:14px;padding:10px 14px;font-size:15px}
.restcard .next b{display:block;font:700 20px/1.1 var(--display);text-transform:uppercase}
.restcard .btns{display:flex;gap:10px;margin-top:10px}
.restcard .btns button{border:2px solid #fff;background:transparent;color:#fff;border-radius:14px;padding:14px 18px;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.bar{position:absolute;left:0;top:0;height:6px;background:var(--gold);transition:width 1s linear}
.donecard{flex:1;background:var(--done-soft);border:1px solid var(--accent);border-radius:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px;text-align:center}
.donecard h2{margin:0;font-size:36px;color:var(--accent)}
.donecard p{margin:0;font-size:17px}
.donecard .go{margin-top:12px}
.intro{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
.intro h2{font-size:32px}
.intro p{margin:0;color:var(--muted)}
.picker{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.picker h2{font-size:30px}
.picker .grp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.picker .grp h3{margin:0;font:700 20px/1.1 var(--display);text-transform:uppercase}
.picker .grp p{margin:0;color:var(--muted);font-size:14px}
.picker .ws{display:flex;flex-wrap:wrap;gap:8px}
.picker .ws a{text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.change{font:700 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--brand);text-decoration:none;background:none;border:0;text-align:left;padding:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
<header class="top">
  <div class="where" id="where">21 Day Challenge</div>
  <a id="listLink" href="index.html#all">List view</a>
</header>
<div class="dots" id="dots"></div>
<main id="main"></main>

<script src="app.js"></script>
<script>
const {store,esc,EMBED_OK}=C21;
const $=s=>document.querySelector(s);
let W=null, G=null, steps=[], at=-1, rest=null, timer=null, hold=null, openVid=false;
const key=()=>`c21:${W.id}`;
const isCardio=()=>W.kind==='cardio';
function workSeconds(e){const m=(e.reps||'').match(/^(\d+)\s*s$/);return m?+m[1]:(isCardio()?W.work||45:0)}

// Steps: every exercise of every round, with a rest step after the last exercise of a circuit.
function buildSteps(){
  steps=[];
  for(const b of W.blocks){
    for(let r=0;r<W.sets;r++){
      b.exercises.forEach((e,i)=>{steps.push({kind:'ex',e,round:r,block:b,last:i===b.exercises.length-1})});
      if(W.restSeconds>0 && r<W.sets-1) steps.push({kind:'rest',block:b,round:r});
    }
  }
}
// Rest and work timers run on the clock, so a locked phone comes back to the right number.
function startTimer(kind,sec){
  stopTimer();const ends=Date.now()+sec*1000;
  const t={kind,ends,total:sec,left:sec};if(kind==='rest')rest=t;else hold=t;
  timer=setInterval(()=>{t.left=Math.ceil((t.ends-Date.now())/1000);
    if(t.left<=0){stopTimer();C21.beep();if(kind==='rest')next();else if(kind==='work')next();else{hold={done:true};render()}}else tick(t)},250);
  render();
}
function stopTimer(){clearInterval(timer);timer=null;rest=null;hold=null}
function tick(t){const el=$('#tnum'),b=$('#tbar');if(el)el.textContent=t.left;if(b)b.style.width=(100*(t.total-t.left)/t.total)+'%'}
function tickSet(e,round,on){const s=store.get(key(),{ticks:{}});const a=s.ticks[e.code]||[];a[round]=on;s.ticks[e.code]=a;store.set(key(),s)}

function next(){
  stopTimer();openVid=false;
  const cur=steps[at];
  if(cur&&cur.kind==='ex'){tickSet(cur.e,cur.round,true);
    if(cur.last&&W.restSeconds>0&&cur.round<W.sets-1){at++;startTimer('rest',W.restSeconds);return}}
  at++;
  if(at>=steps.length){finish();return}
  if(steps[at].kind==='rest'){startTimer('rest',W.restSeconds);return}
  render();window.scrollTo(0,0);
}
function back(){stopTimer();openVid=false;if(at>0){at--;if(steps[at].kind==='rest')at--;if(steps[at]&&steps[at].kind==='ex')tickSet(steps[at].e,steps[at].round,false)}render()}
function finish(){
  const s=store.get(key(),{ticks:{}});s.finished=Date.now();store.set(key(),s);
  C21.logWorkout(W);
  at=steps.length;render();
}
function nextDayLink(){
  const d=C21.data(); const n=C21.dayNumber(); const day=d.days.find(x=>x.day===n+1);
  if(!day) return ['See the calendar','calendar.html'];
  const w=day.workout?C21.workoutOf(day.workout):null;
  return [w?`Tomorrow: ${w.name}`:`Tomorrow: ${day.title||'rest'}`,w?`play.html#${w.id}`:'calendar.html'];
}

function render(){
  $('#listLink').href=`index.html#${W.id}`;
  const exSteps=steps.filter(s=>s.kind==='ex');
  const doneCount=steps.slice(0,Math.max(at,0)).filter(s=>s.kind==='ex').length;
  $('#dots').innerHTML=exSteps.map((s,i)=>`<i class="${i<doneCount?'done':i===doneCount&&at<steps.length?'now':''}"></i>`).join('');
  const m=$('#main');
  if(at<0){ // intro screen
    $('#where').innerHTML=`${esc(G.name)}<small>${esc(W.name)}</small>`;
    m.innerHTML=`<div class="intro"><h2>${esc(W.name)}</h2>
      <p>${esc(W.setsLabel)}${isCardio()?` · ${W.work} seconds a move`:W.reps?` · ${esc(W.reps)} reps`:''}${W.restLabel?` · rest ${esc(W.restLabel)}`:''}. ${exSteps.length} moves in total, counting every round. I'll tell you what's next and run the timers for you.</p>
      <p>${esc(W.how)}</p>${W.gear?`<p><b style="color:var(--ink)">You need:</b> ${esc(W.gear)}</p>`:''}${W.todo?`<p class="todo">${esc(W.todo)}</p>`:''}
      ${W.lessonVideo?(openVid===W.lessonVideo&&EMBED_OK?`${C21.yt(W.lessonVideo,W.name,true)}<button class="change" data-embed="${esc(W.lessonVideo)}">✕ Close video</button>`:EMBED_OK?`<button class="change" data-embed="${esc(W.lessonVideo)}">▶ Follow along with Michelle instead</button>`:`<a class="change" href="https://www.youtube.com/watch?v=${esc(W.lessonVideo)}" target="_blank" rel="noopener">▶ Follow along with Michelle instead</a>`):''}
      <button class="go" id="start">Start</button><a class="change" href="play.html">Pick a different workout</a></div>`;
    return;
  }
  if(at>=steps.length){
    $('#where').innerHTML=`${esc(G.name)}<small>${esc(W.name)}</small>`;
    const n=store.get('c21:log',[]).filter(x=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return x.t>=d.getTime()}).length;
    const [nl,nh]=nextDayLink();
    const msg=isCardio()?'Drink water. Protein and a little fruit within the half hour.':'Nice work. Water, a protein snack, and stretch it out.';
    m.innerHTML=`<div class="donecard"><h2>${esc(W.name)} done</h2><p>${msg}</p><p><b>${n}</b> workout${n===1?'':'s'} this week.</p>
      <a class="go" style="text-decoration:none" href="${nh}">${esc(nl)}</a><a class="go brand" style="text-decoration:none" href="calendar.html">See my 21 days</a><a class="go quiet" style="text-decoration:none" href="start.html">Home</a></div>`;
    return;
  }
  const s=steps[at];
  if(s.kind==='rest'){
    const nx=steps[at+1];const ne=nx&&nx.kind==='ex'?nx.e:null;
    $('#where').innerHTML=`Rest<small>Round ${s.round+1} of ${W.sets} done</small>`;
    m.innerHTML=`<div class="restcard"><div class="bar" id="tbar" style="width:${rest?100*(rest.total-rest.left)/rest.total:0}%"></div>
      <div class="big" id="tnum">${rest?rest.left:W.restSeconds}</div><div class="lbl">Rest</div><div class="sub">Breathe. Sip some water.</div>
      ${ne?`<div class="next">Next up<b>${esc(ne.code)} · ${esc(ne.name)}</b>round ${s.round+2} of ${W.sets}</div>`:''}
      <div class="btns"><button id="plus">+15s</button><button id="skip">Skip rest</button></div></div>`;
    return;
  }
  const e=s.e;const ws=workSeconds(e);
  const idx=exSteps.indexOf(s);
  $('#where').innerHTML=`Round ${s.round+1} of ${W.sets}${s.block.label==='Circuit'?'':' · circuit '+esc(s.block.label)}<small>${idx+1} of ${exSteps.length}</small>`;
  const pic=e.startPhoto&&e.endPhoto
    ?`<div class="pair"><figure><img src="${esc(e.startPhoto)}" alt=""><figcaption>Start</figcaption></figure><figure><img src="${esc(e.endPhoto)}" alt=""><figcaption>End</figcaption></figure></div>`:'';
  const links=e.video?(EMBED_OK?`<button data-embed="${esc(e.video)}">${openVid===e.video?'✕ Close demo':'▶ Watch demo'}</button>`:`<a href="https://www.youtube.com/watch?v=${esc(e.video)}" target="_blank" rel="noopener">▶ Watch demo</a>`):'';
  const workUI=ws?(hold&&!hold.done&&hold.kind==='work'?`<div class="hold"><div class="bar" id="tbar" style="width:${100*(hold.total-hold.left)/hold.total}%"></div><div class="t" id="tnum">${hold.left}</div><div>Keep moving</div><button id="stopHold">Stop</button></div>`
    :`<button class="go" id="startWork">⏱ Go · ${ws} seconds</button>`):'';
  m.innerHTML=`<div class="card">${pic}${openVid&&EMBED_OK?C21.yt(openVid,e.name+' demo',true):''}
    <h1><span class="code">${esc(e.code)}</span><span>${esc(e.name)}</span></h1>
    <div class="chips">${e.reps?`<span class="chip hot">${esc(e.reps)}${/^\d+$/.test(e.reps)?' reps':''}</span>`:''}${e.note?`<span class="chip">${esc(e.note)}</span>`:''}</div>
    ${e.cue?`<p class="cue">${esc(e.cue)}</p>`:''}
    ${workUI}
    <div class="links">${links}</div></div>
    <div class="row">${at>0?'<button class="back" id="back">Back</button>':''}<button class="go ${ws?'quiet':''}" id="done">${ws?'Skip · next':(s.last&&W.restSeconds>0&&s.round<W.sets-1?'Done · start rest':(at===steps.length-1?'Done · finish':'Done · next'))}</button></div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.id==='start'){store.set(key(),{ticks:{}});at=0;render();return}
  if(b.id==='done'){next();return}
  if(b.id==='back'){back();return}
  if(b.id==='skip'){next();return}
  if(b.id==='plus'&&rest){rest.ends+=15000;rest.total+=15;return}
  if(b.id==='startWork'){startTimer('work',workSeconds(steps[at].e));return}
  if(b.id==='stopHold'){stopTimer();render();return}
  if(b.dataset.embed){openVid=openVid===b.dataset.embed?false:b.dataset.embed;render();return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(rest||hold))render()});

C21.load().then(d=>{
  const id=decodeURIComponent(location.hash.replace(/^#/,'')).toLowerCase();
  W=C21.workoutOf(id);if(!W){renderPicker();return}
  G=C21.weekOf(W.week);buildSteps();render();
});

// No workout in the address: list every week and workout, each a link into play mode.
function renderPicker(){
  const d=C21.data();
  $('#where').innerHTML=`21 Day Challenge<small>Pick a workout</small>`;
  $('#listLink').href='index.html#all';$('#dots').innerHTML='';
  const n=C21.dayNumber(); const day=d.days.find(x=>x.day===n&&x.workout);
  $('#main').innerHTML=`<div class="picker"><h2>What are we doing today?</h2>
    ${day?`<a class="go" style="text-decoration:none" href="play.html#${esc(day.workout)}">▶ Day ${n}: ${esc(C21.workoutOf(day.workout).name)}</a>`:''}
    <p style="margin:0;color:var(--muted)">Play walks you through one move at a time and runs the timers. Want the whole workout on one page? Tap List view, top right.</p>
    ${d.weeks.map(g=>`<div class="grp"><h3>${esc(g.name)}</h3><p>${esc(g.intro)}</p><div class="ws">${C21.weekWorkouts(g.id).map((w,i)=>`<a href="play.html#${esc(w.id)}">▶ ${esc(g.id===0?'Day '+(i+1):w.name)}</a>`).join('')}</div></div>`).join('')}
  </div>`;
}
window.addEventListener('hashchange',()=>location.reload());
</script>
