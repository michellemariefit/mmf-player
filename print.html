<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 Day Fit Pregnancy Challenge · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Lato:wght@400;700&display=swap">
<style>
/* One landscape letter page per workout. Every exercise with its start and end photo in a tight grid.
   Black and white friendly: no fills, thin rules, photos do the work. Reads data/challenge.json like the player. */
@page{size:letter landscape;margin:0.35in}
:root{--ink:#111;--muted:#555;--line:#999;--pink:#dd2289}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:400 10.5pt/1.3 Lato,"Helvetica Neue",Helvetica,Arial,sans-serif}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #ddd;background:#f6f6f6;font-size:14px}
.toolbar select,.toolbar button{font:inherit;padding:6px 10px}
.toolbar button{background:#111;color:#fff;border:0;border-radius:6px;cursor:pointer}
.toolbar .back{font-weight:700;color:var(--pink);text-decoration:none;letter-spacing:.04em;text-transform:uppercase;font-size:13px;margin-right:4px}
.page{width:10.3in;height:7.8in;margin:16px auto;padding:0;display:flex;flex-direction:column;gap:6pt;page-break-after:always;break-after:page;overflow:hidden}
.page:last-child{page-break-after:auto;break-after:auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12pt;border-bottom:2px solid var(--ink);padding-bottom:4pt}
.head h1{margin:0;font:700 24pt/1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.01em;text-transform:uppercase}
.head .eyebrow{font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3pt}
.box{display:grid;grid-template-columns:1fr 1fr;gap:0 14pt;border:1px solid var(--line);border-radius:6pt;padding:5pt 8pt;font-size:9.5pt}
.box b{text-transform:uppercase;font-size:8pt;letter-spacing:.08em;margin-right:4pt}
.box p{margin:0}
.box .plan{font-size:11pt;font-weight:700;margin-bottom:1pt}
.grid{flex:1;display:grid;gap:5pt;min-height:0}
.cell{border:1px solid var(--line);border-radius:6pt;padding:4pt 6pt;display:flex;flex-direction:column;gap:3pt;min-height:0;overflow:hidden}
.cell h2{margin:0;font:700 11.5pt/1.1 "Barlow Condensed",Arial,sans-serif;display:flex;gap:6pt;align-items:baseline;text-transform:uppercase}
.cell h2 .code{font-size:9pt;border:1.5px solid var(--ink);border-radius:4pt;padding:1pt 4pt;white-space:nowrap}
.cell .note{font-size:8pt;color:var(--muted);margin:0}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:4pt}
.pics figure{margin:0;position:relative}
.pics img{width:100%;aspect-ratio:var(--ar,4/3);object-fit:cover;border-radius:4pt;display:block}
.pics figcaption{position:absolute;left:3pt;top:3pt;font-size:7pt;letter-spacing:.1em;text-transform:uppercase;background:#fff;border:1px solid var(--ink);padding:1pt 3pt;border-radius:3pt}
.nopic{flex:1;display:grid;place-items:center;border:1px dashed var(--line);border-radius:4pt;font-size:9pt;color:var(--muted);min-height:40pt}
.foot{display:flex;justify-content:space-between;font-size:8pt;color:var(--muted);border-top:1px solid var(--line);padding-top:3pt}
@media print{.toolbar{display:none}.page{margin:0;width:auto;height:7.7in}}
@media screen and (max-width:900px){.page{width:auto;height:auto;padding:12px}.grid{grid-template-columns:1fr 1fr !important}.cell{min-height:150px}}
</style>
<div class="toolbar">
  <a class="back" href="start.html">← Home</a>
  <label>Workout <select id="pick"></select></label>
  <button id="printBtn">Print</button>
  <span id="hint">Tip: in the print box choose Landscape and turn off headers and footers.</span>
</div>
<div id="pages"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null;
const weekOf=id=>DATA.weeks.find(w=>w.id===id);
function all(){return DATA.workouts.map(w=>({w,g:weekOf(w.week)}))}
function layout(n){const cols=n<=6?2:n<=8?3:4;return {cols,rows:Math.ceil(n/cols)}}
function pageHTML(w,g){
  const exs=w.blocks.flatMap(b=>b.exercises.map(e=>({...e,block:b.label})));
  const {cols,rows}=layout(exs.length);
  const ar=(cols===2&&exs.length>4)?'16/9':'4/3';
  let shown='';
  const cells=exs.map(e=>{
    const pics=e.startPhoto&&e.endPhoto
      ?`<div class="pics"><figure><img src="${esc(e.startPhoto)}" alt=""><figcaption>Start</figcaption></figure><figure><img src="${esc(e.endPhoto)}" alt=""><figcaption>End</figcaption></figure></div>`
      :`<div class="nopic">${w.kind==='cardio'?'Keep moving for the full time':'Photo coming'}</div>`;
    const bits=[e.reps?(/^\d+$/.test(e.reps)?e.reps+' reps':e.reps):'',e.note].filter(Boolean).join(' · ');
    return `<div class="cell"><h2><span class="code">${esc(e.code)}</span><span>${esc(e.name)}</span></h2>${pics}${bits?`<p class="note">${esc(bits)}</p>`:''}</div>`;
  }).join('');
  const plan=[w.setsLabel,w.kind==='cardio'?`${w.work} s a move`:(w.reps?`${w.reps} reps`:''),w.restLabel?`rest ${w.restLabel}`:''].filter(Boolean).join(' · ');
  const order=w.blocks.length>1?`Do circuit ${w.blocks.map(b=>b.label).join(', then ')} in order.`:'Do the moves in order, rest, then go again.';
  return `<section class="page">
    <div class="head"><div><div class="eyebrow">21 Day Fit Pregnancy Challenge · ${esc(g.name)}</div><h1>${esc(w.name)}</h1></div>
      <div style="font-size:8.5pt;color:var(--muted);text-align:right">${esc(order)}<br>Demo videos: in the app</div></div>
    <div class="box"><div><p class="plan">${esc(plan)}</p><p><b>How</b>${esc(w.how)}</p></div><div>${w.gear?`<p><b>You need</b>${esc(w.gear)}</p>`:''}${w.todo?`<p><b>Note</b>${esc(w.todo)}</p>`:''}</div></div>
    <div class="grid" style="--ar:${ar};grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},minmax(0,1fr))">${cells}</div>
    <div class="foot"><span>21 Day Fit Pregnancy Challenge · © 2026 Michelle Marie Fit</span><span>Start photo = where you begin · End photo = the top of the move</span></div>
  </section>`;
}
function render(){
  const want=decodeURIComponent(location.hash.replace(/^#/,'')).toLowerCase();
  const items=all();
  const sel=document.getElementById('pick');
  sel.innerHTML=`<option value="all">All workouts (${items.length} pages)</option>`+DATA.weeks.map(g=>`<optgroup label="${esc(g.name)}">${DATA.workouts.filter(w=>w.week===g.id).map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}</optgroup>`).join('');
  const gm=want.match(/^week-(\d)$/);
  const pick=items.find(x=>x.w.id===want)?want:(gm?want:'all');
  sel.value=items.find(x=>x.w.id===want)?want:'all';
  const show=pick==='all'?items:items.filter(x=>x.w.id===pick||(gm&&x.g.id===+gm[1]));
  document.getElementById('pages').innerHTML=show.map(x=>pageHTML(x.w,x.g)).join('');
  document.title=(show.length===1?show[0].w.name:'21 Day Challenge Workouts')+' · Print';
}
fetch('data/challenge.json').then(r=>r.json()).then(d=>{DATA=d;render()});
document.getElementById('pick').addEventListener('change',e=>{location.hash=e.target.value==='all'?'':e.target.value});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
window.addEventListener('hashchange',render);
</script>
