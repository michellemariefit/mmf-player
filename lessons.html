<!doctype html>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Notes · 21 Day Fit Pregnancy Challenge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dd2289">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="21 Day">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* The one-page notes for each lesson video, plus the FAQ. Reads data/lessons.json. Prints ink-light. */
.wrap{max-width:620px}
header{padding-top:14px;display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font:700 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
h2.mod{margin:10px 0 0;font:700 14px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card h3{margin:0;font:700 22px/1.1 var(--display);display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-transform:uppercase}
.card h3 small{font:700 12px/1 var(--body);color:var(--accent);white-space:nowrap;letter-spacing:.06em}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.card .do{border-top:1px dashed var(--line);padding-top:8px}
.card .do b{display:block;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.card .do label{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.card .do input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}
.card.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.faq .q{font:700 18px/1.2 var(--display);margin:0;text-transform:uppercase}
.faq .a{margin:4px 0 0}
.faq .src{font-size:12px;color:var(--muted)}
.pdfs{display:flex;gap:8px;flex-wrap:wrap}
.pdfs a{font:700 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:var(--card)}
@media print{
  @page{size:letter;margin:.5in}
  body{background:#fff;color:#000;padding:0;font-size:11.5px}
  .tabs,.toolrow,a.back,.lead,.pdfs{display:none}
  .wrap{max-width:none;gap:8px}.card{border-color:#999;border-radius:6px;background:#fff;padding:8px 10px}
  h2.mod{break-after:avoid}
}
</style>
<div class="wrap">
  <header><a class="back" href="start.html">← Home</a><span class="eyebrow">21 Day Fit Pregnancy Challenge</span><h1>Lesson notes</h1>
    <p class="lead">Can't watch right now? Every lesson, boiled down to what it says and what to do about it. Tick the "do" items as you go.</p>
    <div class="tabs" id="tabs"></div>
    <div class="pdfs"><a href="pdf/affirmations.pdf" target="_blank">Affirmations PDF</a><a href="pdf/checklist.pdf" target="_blank">Daily checklist PDF</a><a href="pdf/weekly-calendar.pdf" target="_blank">Weekly planner PDF</a><a href="pdf/home-gym-checklist.pdf" target="_blank">Home gym checklist</a></div>
    <div class="toolrow"><button class="link" id="printBtn">🖨 Print these notes</button></div></header>
  <div id="body"></div>
</div>
<script src="app.js"></script>
<script>
const {store,esc}=C21;
const $=s=>document.querySelector(s);
let D=null, tab=store.get('c21:lessons:tab','all');
function render(){
  const tabs=[['all','All'],['week1','Week 1'],['faq','Questions']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`).join('');
  const done=store.get('c21:lessons:done',{});
  if(tab==='faq'){
    $('#body').innerHTML=`<div class="card faq" style="gap:14px">${D.faq.items.map(f=>`<div><p class="q">${esc(f.q)}</p><p class="a">${esc(f.a)}</p><div class="src">From: ${esc(f.source)}</div></div>`).join('')}</div>`;
    return;
  }
  const n=C21.dayNumber();
  $('#body').innerHTML=D.modules.map(m=>{
    const ls=m.lessons.filter(l=>tab==='all'||(tab==='week1'&&l.day&&l.day<=7));
    if(!ls.length) return '';
    return `<h2 class="mod">${esc(m.name)}</h2>`+ls.map(l=>`<section class="card ${l.day===n?'now':''}" id="${esc(l.id)}"><h3><span>${esc(l.title)}</span>${l.day?`<small>${l.day===n?'Today':'Day '+l.day}</small>`:''}</h3>
      <ul>${l.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      ${l.do.length?`<div class="do"><b>Do</b>${l.do.map((d,i)=>{const id=l.id+':'+i;return `<label><input type="checkbox" data-done="${id}" ${done[id]?'checked':''}><span>${esc(d)}</span></label>`}).join('')}</div>`:''}</section>`).join('');
  }).join('');
  if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView({block:'start'})}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;store.set('c21:lessons:tab',tab);render()}
  if(b.id==='printBtn'){window.print()}});
document.addEventListener('change',e=>{const c=e.target.closest('input[data-done]');if(!c)return;const d=store.get('c21:lessons:done',{});d[c.dataset.done]=c.checked;store.set('c21:lessons:done',d)});
Promise.all([fetch('data/lessons.json').then(r=>r.json()),C21.load()]).then(([d])=>{D=d;if(location.hash&&tab==='faq')tab='all';render()});
</script>
