<!doctype html>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workouts · 21 Day Fit Pregnancy Challenge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dd2289">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="21 Day">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* List view: the whole workout on one page. Sticky header with week and workout pickers, then one
   card per circuit that you work down; a rest timer appears under the circuit you just ticked.
   Links: index.html#w1-arms shows one workout, #week-1 a week with its picker, #all everything. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.intro{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.intro p{margin:0;color:var(--muted)}
.intro p b{color:var(--ink)}
.plan{display:flex;flex-wrap:wrap;gap:6px}
.ss{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ss-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 4px;gap:8px}
.ss-head h2{margin:0;font-size:20px}
.ss-head span{font-size:13px;color:var(--muted)}
.ss.complete{border-color:var(--done)}
.ss.complete .ss-head span{color:var(--done);font-weight:700}
.ex{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;position:relative}
.pair img{width:100%;height:auto;aspect-ratio:16/13;object-fit:cover;border-radius:12px;background:var(--brand-soft)}
.pair figcaption{position:absolute;left:6px;top:6px;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:rgba(54,45,112,.82);color:#fff;padding:4px 7px;border-radius:5px}
.ex .info{min-width:0;display:flex;flex-direction:column;gap:8px}
.ex h3{margin:0;font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.code{display:inline-block;font:700 14px/1 var(--display);color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:4px 7px;margin-right:8px;letter-spacing:.04em;vertical-align:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.cue{font-size:14px;color:var(--muted);margin:0}
.cue b{color:var(--brand);font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;margin-right:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets button{min-width:48px;height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.sets button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.links{display:flex;gap:12px;flex-wrap:wrap}
.demo{font-weight:700;font-size:14px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0}
.embed{grid-column:1/-1;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.embed iframe{width:100%;height:100%;border:0}
.finish{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.finish:disabled{opacity:.45;cursor:default}
.week{text-align:center;color:var(--muted);font-size:14px;margin:0}
.week b{color:var(--accent)}
.done-card{background:var(--done-soft);border:1px solid var(--done);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.done-card h2{margin:0;font-size:30px;color:var(--accent)}
.done-card button{align-self:flex-start;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:6px}
.rest{grid-column:1/-1;position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:14px;padding:14px 14px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.restwrap .rest{border-radius:20px;padding:18px 16px 16px}
.restwrap .rest .t{font-size:52px}
.rest.work{background:var(--accent);color:var(--accent-ink)}
.rest .t{font:700 42px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2.4ch}
.rest .lbl{flex:1;min-width:120px;font-size:14px;font-weight:700}
.rest .lbl small{display:block;opacity:.85;font-weight:400}
.rest .btns{display:flex;gap:8px;flex:none}
.rest button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
.bar{position:absolute;left:0;top:0;height:4px;background:var(--gold);transition:width 1s linear}
.nudge{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.nudge b{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.nudge>a{font:700 26px/1 var(--display);color:var(--ink);text-decoration:none;text-transform:uppercase}
.nudge small{color:var(--muted);font-size:14px}
.nudge .minis{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.nudge .minis a{font:700 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.howto{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.howto .got{align-self:flex-start;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;margin-top:4px}
.howto-link{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <a class="back" href="start.html">← Home</a>
    <span class="eyebrow" id="eyebrow">21 Day Fit Pregnancy Challenge</span>
    <div class="pick nums" id="groupPick" aria-label="Week"></div>
    <h1 id="title">Loading…</h1>
    <div class="pick nums" id="workoutPick" aria-label="Workout"></div>
  </header>

  <section id="nudge"></section>
  <section id="howto"></section>
  <section class="intro" id="intro"></section>
  <main id="workout" class="wrap" style="gap:14px"></main>
  <p class="week" id="week"></p>
</div>

<script src="app.js"></script>
<script>
const {store,esc,EMBED_OK}=C21;
const state={group:null,workout:null,lock:'none',openVid:{},justOpened:null};
const $=s=>document.querySelector(s);
const key=()=>`c21:${state.workout}`;
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekLog(){return store.get('c21:log',[]).filter(t=>t.t>=weekStart())}
const W=()=>C21.workoutOf(state.workout), G=()=>C21.weekOf(state.group);
function shortName(w,g){const n=C21.weekWorkouts(g.id).indexOf(w)+1;return g.id===0?`Day ${n}`:w.name}

// "Today" for this phone: the day on the challenge calendar, and the workout it carries.
function nudgeHTML(d){
  const n=C21.dayNumber(); const day=d.days.find(x=>x.day===n);
  const done=C21.doneDays();
  if(!day) return `<div class="nudge"><b>${n<1?'Before day 1':'After day 21'}</b><a href="calendar.html">Open the calendar</a><small>${n<1?'Your start date is in the future. Change it on the calendar if that is wrong.':'You finished the 21 days. Start again, or keep any workout you liked.'}</small></div>`;
  const w=day.workout?C21.workoutOf(day.workout):null;
  const title=w?w.name:(day.title||'Rest day');
  return `<div class="nudge"><b>Today · Day ${n} of 21</b>${w?`<a href="play.html#${esc(w.id)}">▶ ${esc(title)}</a>`:`<a href="calendar.html">${esc(title)}</a>`}
    <small>${done[n]?'Done. Nice.':w?(w.kind==='cardio'?'Cardio day. 15 to 20 minutes.':'Strength day. 15 to 20 minutes.'):(day.extra||'Walk, stretch, drink water.')}${day.lesson?` · <a href="lessons.html#${esc(day.lesson)}" style="color:var(--accent)">Today's lesson</a>`:''}</small>
    <span class="minis"><a href="calendar.html">Calendar</a><a href="meals.html">Meal plan</a><a href="lessons.html">Lessons</a></span></div>`;
}
function howtoHTML(w){
  if(store.get('c21:howto',false)) return `<button class="howto-link" data-howto="show">How this works</button>`;
  const c=w.blocks[0].exercises.map(e=>e.code), first=c[0], last=c[c.length-1], multi=w.blocks.length>1;
  const steps=w.kind==='cardio'
    ?`<li>Tap <b>Go</b> on the first move. The timer runs, beeps, and you move on to the next one.</li>
      <li>After the last move of a round, tap <b>Round 1</b> under it. Then start the next round from the top.</li>
      <li>Rather be told what to do? Tap <b>Play it step by step</b>: it runs every timer for you.</li>`
    :`<li>Do ${c.map(x=>`<b>${esc(x)}</b>`).join(', then ')}, one after the other. That's one round.</li>
      <li>After <b>${esc(last)}</b>, tap <b>Round 1</b> under it. A rest timer appears below the circuit.</li>
      <li>When it hits zero, back to <b>${esc(first)}</b> for round 2.${multi?` Then do the same for circuit <b>${esc(w.blocks[1].label)}</b>.`:''}</li>
      <li>Tap a round again to untick it. When every round is ticked, press Finish.</li>`;
  return `<div class="howto"><h2>How this works</h2><ol>${steps}</ol><p class="note">Rather be walked through it? Tap <b>Play it step by step</b> just below. Need paper? Tap <b>Print</b>.</p><button class="got" data-howto="hide">Got it</button></div>`;
}
function workSeconds(e,w){const m=(e.reps||'').match(/^(\d+)\s*s$/);return m?+m[1]:(w.kind==='cardio'?w.work||45:0)}
function restHTML(){
  if(!rest) return '';
  return `<div class="rest ${rest.kind}" id="rest" role="timer" aria-live="off"><div class="bar" id="bar" style="width:${rest.total?100*(rest.total-rest.left)/rest.total:0}%"></div>
    <div class="t" id="tLeft">${Math.max(rest.left,0)}</div><div class="lbl">${rest.kind==='work'?'Go':'Rest'}<small>${esc(rest.label)}</small></div>
    <div class="btns">${rest.kind==='work'?'':'<button data-rest="plus">+15s</button>'}<button data-rest="skip">${rest.kind==='work'?'Stop':'Skip rest'}</button></div></div>`;
}

async function render(){
  let d;
  try{d=await C21.load()}catch(e){$('#workout').innerHTML=`<div class="err">The workouts didn't load. Check your connection and refresh the page.</div>`;return}
  const g=G(), w=W();
  $('#eyebrow').textContent=`21 Day Challenge · ${g.name}`;
  $('#title').textContent=w.name;
  $('#groupPick').innerHTML=state.lock==='none'?d.weeks.map(x=>`<button aria-pressed="${x.id===g.id}" data-group="${x.id}">${esc(x.name.replace('Bonus: ','Bonus '))}</button>`).join(''):'';
  const ws=C21.weekWorkouts(g.id);
  $('#workoutPick').innerHTML=(state.lock!=='workout'&&ws.length>1)?ws.map(x=>{
    const done=store.get(`c21:${x.id}`,{}).finished;
    return `<button aria-pressed="${x.id===w.id}" data-workout="${x.id}" class="${done?'is-done':''}">${esc(shortName(x,g))}</button>`}).join(''):'';

  const lv=w.lessonVideo&&EMBED_OK?(state.openVid.intro===w.lessonVideo?`<button class="demo" data-embed="${esc(w.lessonVideo)}" data-code="intro">✕ Close video</button>${C21.yt(w.lessonVideo,w.name+' follow along',true)}`:`<button class="demo" data-embed="${esc(w.lessonVideo)}" data-code="intro">▶ Follow along with Michelle (video)</button>`):(w.lessonVideo?`<a class="demo" href="https://www.youtube.com/watch?v=${esc(w.lessonVideo)}" target="_blank" rel="noopener">▶ Follow along with Michelle (video)</a>`:'');
  $('#intro').innerHTML=`<div class="plan"><span class="chip hot">${esc(w.setsLabel)}</span>${w.kind==='cardio'?`<span class="chip hot">${esc(String(w.work))} s each move</span>`:w.reps?`<span class="chip hot">${esc(w.reps)} reps</span>`:''}${w.restLabel?`<span class="chip hot">Rest ${esc(w.restLabel)}</span>`:''}</div>
    <p><b>How:</b> ${esc(w.how)}</p>${w.gear?`<p><b>You need:</b> ${esc(w.gear)}</p>`:''}${w.todo?`<p class="todo">${esc(w.todo)}</p>`:''}${lv}
    <div class="toolrow"><a href="play.html#${esc(w.id)}" class="play">▶ Play it step by step</a><a href="print.html#${esc(w.id)}" target="_blank" rel="noopener">🖨 Print</a></div>`;
  $('#howto').innerHTML=howtoHTML(w);
  $('#nudge').innerHTML=state.lock==='none'?nudgeHTML(d):'';

  const saved=store.get(key(),{ticks:{}});
  let allDone=true;
  let html=w.blocks.map(s=>{
    const n=s.exercises.length, kind=n===2?'Superset':'Circuit';
    const complete=s.exercises.every(e=>(saved.ticks[e.code]||[]).filter(Boolean).length>=w.sets);
    if(!complete) allDone=false;
    const head=`<div class="ss-head"><h2>${s.label==='Circuit'?'The circuit':`Circuit ${esc(s.label)}`}</h2><span>${complete?'Done':`${esc(w.setsLabel)}, back to back`}</span></div>`;
    return `<section class="ss ${complete?'complete':''}">${head}`+
    s.exercises.map(e=>{
      const t=saved.ticks[e.code]||[];
      const btns=Array.from({length:w.sets},(_,i)=>`<button aria-pressed="${!!t[i]}" aria-label="Round ${i+1} of ${esc(e.name)}" data-tick="${e.code}" data-i="${i}">Round ${i+1}</button>`).join('');
      const links=e.video?(EMBED_OK
        ?`<button class="demo" data-embed="${esc(e.video)}" data-code="${e.code}">${state.openVid[e.code]===e.video?'✕ Close':'▶ Watch demo'}</button>`
        :`<a class="demo" href="https://www.youtube.com/watch?v=${esc(e.video)}" target="_blank" rel="noopener">▶ Watch demo</a>`)
        :(w.kind==='cardio'?'':`<span class="note">Demo video coming</span>`);
      const secs=workSeconds(e,w);
      const pair=e.startPhoto&&e.endPhoto;
      const pic=pair
        ?`<div class="pair"><figure><img src="${esc(e.startPhoto)}" alt="Start position for ${esc(e.name)}" loading="lazy"><figcaption>Start</figcaption></figure><figure><img src="${esc(e.endPhoto)}" alt="End position for ${esc(e.name)}" loading="lazy"><figcaption>End</figcaption></figure></div>`:'';
      const vid=state.openVid[e.code];
      return `<div class="ex" id="ex-${e.code}">
        ${pic}
        <div class="info"><h3><span class="code">${esc(e.code)}</span>${esc(e.name)}</h3>
          <div class="meta">${e.reps?`<span class="chip">${esc(e.reps)}${/^\d+$/.test(e.reps)?' reps':''}</span>`:''}${e.note?`<span class="chip">${esc(e.note)}</span>`:''}</div>
          ${e.cue?`<p class="cue"><b>How</b>${esc(e.cue)}</p>`:''}
          <div class="row"><div class="sets">${btns}${secs?`<button data-work="${e.code}" data-sec="${secs}">⏱ Go ${secs}s</button>`:''}</div></div>
          <div class="links">${links}</div>
        </div>
        ${vid&&EMBED_OK?C21.yt(vid,e.name+' demo',state.justOpened===e.code):''}
        ${rest&&rest.kind==='work'&&rest.code===e.code?restHTML():''}
        </div>`}).join('')+`</section>`+(rest&&rest.kind==='rest'&&rest.block===s.label?`<section class="restwrap">${restHTML()}</section>`:'')}).join('');
  state.justOpened=null;

  if(saved.finished){
    html=`<div class="done-card"><h2>${esc(w.name)} is done</h2><p>Nice work, mama. Water, a protein snack, and stretch it out.</p><button data-reset="1">Do it again another day</button></div>`+html;
  }else{
    html+=`<button class="finish" id="finish" ${allDone?'':'disabled'}>${allDone?'Finish workout':'Tick every round to finish'}</button>`;
  }
  $('#workout').innerHTML=html;
  const log=weekLog();
  $('#week').innerHTML=`<b>${log.length}</b> workout${log.length===1?'':'s'} done this week`+(log.length?`: ${esc(log.map(x=>x.name).join(', '))}`:'');
}

let timer=null,rest=null;   // rest = {code, left, total, label, kind, ends} while a rest or work timer runs
// Counts on the clock, so a locked phone comes back to the right number.
function startRest(code,sec,label,kind='rest',block=null){
  clearInterval(timer);rest={code,block,left:sec,total:sec,label,kind,ends:Date.now()+sec*1000};
  timer=setInterval(()=>{rest.left=Math.ceil((rest.ends-Date.now())/1000);tick();if(rest.left<=0){C21.beep();stopRest(true)}},250);
}
function tick(){const t=$('#tLeft'),b=$('#bar');if(!t||!rest)return;t.textContent=Math.max(rest.left,0);b.style.width=(rest.total?100*(rest.total-rest.left)/rest.total:0)+'%'}
function stopRest(rerender){clearInterval(timer);timer=null;rest=null;if(rerender)render()}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&rest)tick()});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.group!==undefined){state.group=+b.dataset.group;state.workout=C21.weekWorkouts(state.group)[0].id;stopRest();render();return}
  if(b.dataset.workout){state.workout=b.dataset.workout;stopRest();render();return}
  if(b.dataset.tick){
    const w=W();
    const s=store.get(key(),{ticks:{}});const arr=s.ticks[b.dataset.tick]||[];const i=+b.dataset.i;
    arr[i]=!arr[i];s.ticks[b.dataset.tick]=arr;store.set(key(),s);
    if(arr[i]){
      const grp=w.blocks.find(g=>g.exercises.some(x=>x.code===b.dataset.tick));
      const ex=grp.exercises.find(x=>x.code===b.dataset.tick);
      const last=grp.exercises[grp.exercises.length-1].code===ex.code;
      const secs=last?+w.restSeconds||0:0;
      if(secs>0){
        const more=i+1<w.sets;
        startRest(ex.code,secs,more?`Round ${i+1}${grp.label==='Circuit'?'':' of '+grp.label} done · then back to ${grp.exercises[0].code} for round ${i+2}`:`Round ${i+1}${grp.label==='Circuit'?'':' of '+grp.label} done · that was the last one`,'rest',grp.label);
      }
    }
    render();return;
  }
  if(b.dataset.work){startRest(b.dataset.work,+b.dataset.sec,'Keep moving','work');render();return}
  if(b.dataset.rest){
    if(b.dataset.rest==='skip'){stopRest(true);return}
    if(rest){rest.ends+=15000;rest.total+=15;rest.left+=15;tick()}return;
  }
  if(b.dataset.howto){store.set('c21:howto',b.dataset.howto==='hide');render();return}
  if(b.dataset.embed){
    const c=b.dataset.code;
    if(state.openVid[c]===b.dataset.embed)delete state.openVid[c];else{state.openVid[c]=b.dataset.embed;state.justOpened=c}
    render();return;
  }
  if(b.dataset.reset){store.set(key(),{ticks:{}});stopRest();render();return}
  if(b.id==='finish'&&!b.disabled){
    const w=W();
    const s=store.get(key(),{ticks:{}});s.finished=Date.now();store.set(key(),s);
    C21.logWorkout(w);
    stopRest();render();window.scrollTo({top:0,behavior:'smooth'});return;
  }
});
// #w1-arms shows only that workout. #week-1 shows week 1 with a picker. #all shows everything.
// No hash means someone typed the bare address, so send them to the home page.
if(!location.hash&&window.top===window.self)location.replace('start.html');
async function readHash(){
  const d=await C21.load();
  const h=decodeURIComponent(location.hash.replace(/^#/,'')).toLowerCase();
  const w=C21.workoutOf(h); const gm=h.match(/^week-(\d)$/)||(h==='bonus'?[0,'0']:null);
  if(w){state.group=w.week;state.workout=w.id;state.lock='workout'}
  else if(gm&&C21.weekOf(+gm[1])){state.group=+gm[1];state.workout=C21.weekWorkouts(state.group)[0].id;state.lock='group'}
  else{
    // open on today's workout when there is one
    const n=C21.dayNumber(); const day=d.days.find(x=>x.day===n&&x.workout);
    const w0=day?C21.workoutOf(day.workout):d.workouts[0];
    state.group=w0.week;state.workout=w0.id;state.lock='none';
  }
}
readHash().then(render);
window.addEventListener('hashchange',()=>{readHash().then(()=>{stopRest();render()})});
</script>
